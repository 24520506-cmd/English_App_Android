<!doctype html><html lang="vi"><head><meta charset="utf-8"><style>body{font:14px Arial,sans-serif;background:#151832;color:#f7f8ff;padding:18px}h2{color:#7ee6c2;margin:0 0 12px}p{line-height:1.6;color:#cdd5ef}input{margin:18px 0;width:100%}button{width:100%;border:0;border-radius:13px;background:#7ee6c2;color:#20264b;font-weight:bold;padding:15px;cursor:pointer}pre{white-space:pre-wrap;font:12px Arial,sans-serif;color:#8fffd0;max-height:150px;overflow:auto}</style></head><body><h2>✦ STAR JOURNEY UI/UX</h2><p><strong>113 màn hình và trạng thái.</strong> Plugin tạo một trang mới trong file Figma đang mở, giữ nguyên các trang cũ. Chọn <code>design.json</code> đi kèm để import.</p><input type="file" id="file" accept=".json,application/json"><button id="import">TẠO 113 MÀN HÌNH + FLOW</button><pre id="result">Chọn file design.json đi kèm.</pre><script>const res=document.getElementById('result');document.getElementById('import').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){res.textContent='Cần chọn design.json.';return;}res.textContent='Đang tạo frame, nền sao và prototype...';parent.postMessage({pluginMessage:{type:'import',json:await f.text()}},'*')};onmessage=e=>{const d=e.data.pluginMessage;if(!d)return;if(d.type==='result')res.textContent='Đã tạo '+d.screens+' màn hình\nPrototype: '+d.links+' liên kết\nLỗi: '+d.issues.length+(d.issues.length?'\n'+d.issues.join('\n'):'\nĐã hoàn tất.');else if(d.type==='error')res.textContent='ERROR: '+d.error;};</script></body></html>
